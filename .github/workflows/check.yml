name: Handspotter
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  workflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      # TODO: Switch flake checks to DeterminateSystems/determinate-nix-action for Nix setup.
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b
      - run: nix flake check --option builders ''
