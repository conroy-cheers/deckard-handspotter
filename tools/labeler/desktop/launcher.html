<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Frame Hand Labeler</title>
  <link rel="stylesheet" href="/launcher.css">
  <script type="module" src="/launcher.js"></script>
</head>
<body>
  <main>
    <h1>Frame Hand Labeler</h1>
    <div class="actions">
      <button id="open" type="button">Open workspace…</button>
      <button id="resume" type="button" hidden>Return to editor</button>
    </div>
    <form id="import">
      <h2>Import into a new workspace</h2>
      <label>Source type
        <select id="kind">
          <option value="recording">Frame recording</option>
          <option value="archive">HOT3D clip</option>
        </select>
      </label>
      <div class="path">
        <label>Source <input id="source" readonly></label>
        <button id="browse" type="button">Browse…</button>
      </div>
      <fieldset id="hot3d" hidden>
        <div class="path">
          <label>Frame warp rig <input id="rig" readonly placeholder="Keep source camera geometry"></label>
          <button id="browse-rig" type="button">Browse…</button>
          <button id="clear-rig" type="button">Clear</button>
        </div>
        <label>Channel mapping <textarea id="channels" rows="2" placeholder="1201-1=slam_left&#10;1201-2=slam_right"></textarea></label>
        <p class="hint">One source-to-camera mapping per line. Leave blank to import both front views.</p>
      </fieldset>
      <div class="options">
        <label>Start (seconds) <input id="start" type="number" min="0" step="any" placeholder="0"></label>
        <label>Duration (seconds) <input id="duration" type="number" min="0.001" step="any" placeholder="Full clip"></label>
        <label>Sampling
          <select id="sampling">
            <option value="every">Every Nth group</option>
            <option value="hz">Fixed rate (Hz)</option>
          </select>
        </label>
        <label>Sampling value <input id="interval" type="number" min="1" step="1" value="1" required></label>
      </div>
      <button class="accent" id="create" type="submit" disabled>Import…</button>
    </form>
    <p id="status" role="status" aria-live="polite"></p>
  </main>
</body>
</html>
